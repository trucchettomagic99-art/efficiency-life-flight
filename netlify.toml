# EFFICIENCY LIFE — FLIGHT
# Deploy da Git: il sito e' gia' compilato in dist/ dal job notturno,
# quindi Netlify non deve costruire nulla. Pubblica e basta.

[build]
  publish  = "dist"
  command  = ""
  # Il workflow GitHub crea prima un commit sorgente e poi il commit con dist/.
  # Pubblica solo il secondo, evitando di spendere crediti per una build obsoleta.
  ignore   = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF dist"

# La funzione che serve i prezzi in tempo reale (/api/prices).
# Il token Travelpayouts si imposta nel pannello come variabile d'ambiente
# TP_TOKEN — non va mai scritto in un file.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
