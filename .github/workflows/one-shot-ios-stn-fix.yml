name: One-shot iOS STN paint fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-ios-stn-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent offscreen airport badges from painting through Safari chrome
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app.html')
          s = p.read_text(encoding='utf-8')

          old = "#ctryList{max-height:210px!important}\n  #apList{max-height:190px!important}"
          new = "#ctryList{max-height:210px!important}\n  #apList{max-height:190px!important;contain:paint;isolation:isolate}\n  #apList.ap-offscreen{visibility:hidden!important}"
          if old not in s:
              raise SystemExit('mobile airport CSS anchor not found')
          s = s.replace(old, new, 1)

          marker = "/* il pulsante Cerca resta spento finche' non c'e' almeno un aeroporto */"
          if marker not in s:
              raise SystemExit('ready marker not found')

          guard = "\n".join([
              "/* Safari iOS: evita che badge IATA fuori viewport vengano compositati sotto la toolbar. */",
              "(function guardMobileAirportPaint(){",
              "  const list = $('#apList');",
              "  if(!list || !('IntersectionObserver' in window)) return;",
              "  list.classList.add('ap-offscreen');",
              "  const io = new IntersectionObserver(entries => {",
              "    for(const entry of entries)",
              "      list.classList.toggle('ap-offscreen', !entry.isIntersecting);",
              "  }, {root:null, rootMargin:'96px 0px 96px 0px', threshold:0});",
              "  io.observe(list);",
              "})();",
              "",
              "",
          ])
          if 'guardMobileAirportPaint' not in s:
              s = s.replace(marker, guard + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild and validate
        run: |
          python scripts/build.py
          python scripts/build_pages.py
          python scripts/check_build.py
          python - <<'PY'
          from pathlib import Path
          s = Path('src/app.html').read_text(encoding='utf-8')
          assert "#apList.ap-offscreen{visibility:hidden!important}" in s
          assert "contain:paint;isolation:isolate" in s
          assert "guardMobileAirportPaint" in s
          assert "rootMargin:'96px 0px 96px 0px'" in s
          print('iOS offscreen airport paint guard: OK')
          PY

      - name: Commit generated site and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-ios-stn-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent iOS offscreen airport code paint-through'
          git push origin HEAD:main
