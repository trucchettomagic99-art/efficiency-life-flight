name: Verifica credenziali R2

# Si lancia a mano, dal tab Actions. Non tocca i dati, non tocca il sito:
# scrive un oggetto di prova da 53 byte sotto `_verifica/`, lo rilegge e lo
# cancella. Serve per due momenti:
#
#   - il giorno in cui si configurano le chiavi, per sapere subito se
#     funzionano invece di scoprirlo alle 3:20 di notte;
#   - il giorno in cui il caricamento notturno fallira', per capire se e'
#     colpa delle credenziali o di altro.
#
# Non gira mai da solo: nessun `push`, nessun `schedule`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa il client S3
        run: pip install --quiet boto3

      - name: Giro completo su R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/verifica_r2.py
