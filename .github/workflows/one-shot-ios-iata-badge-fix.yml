name: One-shot iOS IATA badge fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-ios-iata-badge-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove iOS Safari IATA ghost layer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app.html')
          s = p.read_text(encoding='utf-8')

          old = '#apList{max-height:190px!important;contain:paint;isolation:isolate}\n  #apList.ap-offscreen{visibility:hidden!important}'
          new = '#apList{max-height:190px!important}\n  #apList.ap-offscreen{visibility:hidden!important}\n  #apList .pk{position:relative;overflow:hidden}\n  #apList .pk .cc{display:none!important}'
          if old not in s:
              raise SystemExit('current mobile apList CSS not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild and validate
        run: |
          python scripts/build.py
          python scripts/build_pages.py
          python scripts/check_build.py
          python - <<'PY'
          from pathlib import Path
          s = Path('src/app.html').read_text(encoding='utf-8')
          assert '#apList .pk .cc{display:none!important}' in s
          assert '#apList .pk{position:relative;overflow:hidden}' in s
          assert 'max-height:190px!important;contain:paint;isolation:isolate' not in s
          assert 'guardMobileAirportPaint' in s
          print('mobile IATA ghost fix: OK')
          PY

      - name: Commit generated site and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-ios-iata-badge-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix iOS Safari airport badge ghosting'
          git push origin HEAD:main
