name: Aggiornamento indice

# Ogni notte alle 03:20 UTC (04:20 in Italia d'inverno, 05:20 d'estate):
# interroga Travelpayouts, ricostruisce l'indice, ricompila il sito e committa.
# L'hosting vede il commit e pubblica da solo.
#
# La cadenza era stata ridotta a tre notti a settimana per non consumare i
# crediti di build di Netlify. Su Cloudflare Pages il piano gratuito prevede
# 500 build al mese contro le 30 che servono qui, quindi torna quotidiana:
# un indice di tariffe aeree vecchio di due giorni e' un indice sbagliato.
#
# Dal 14 settembre 2026 questo flusso NON parte piu' sui push. Partiva su
# ogni modifica a scripts/, src/, tests/ e public/, e faceva la raccolta
# completa: quel giorno cinque push di codice l'hanno fatto girare cinque
# volte, cinque giornate di peso del repository per correggere dei titoli.
# Il collaudo del codice sta in ci.yml, che non tocca la rete ne' i dati.
# Qui restano solo i due modi in cui ha senso raccogliere davvero: l'orario
# notturno e il pulsante. Senza `push` non esiste nemmeno il rischio che il
# commit "Indice tariffe" del bot faccia ripartire una nuova raccolta.
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:        # per lanciarlo a mano dal tab Actions

permissions:
  contents: write           # serve per ricommittare i dati aggiornati

# Una nuova modifica sullo stesso ramo rende obsoleto il job precedente.
# Rami diversi non si bloccano tra loro: il collaudo della PR non deve ritardare
# l'aggiornamento notturno di main e viceversa.
concurrency:
  group: indice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Prima di spendere quota API si collauda la logica di raccolta e
      # validazione, che non dipende da come sono fatte le pagine di ieri.
      - name: Collaudo della logica, prima di spendere quota
        run: |
          python -m unittest discover -s tests -p 'test_flight_data.py' -v
          node tests/test_browser_data.cjs

      - name: Data UTC per checkpoint
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Ripristina checkpoint della raccolta
        uses: actions/cache/restore@v4
        with:
          path: .cache/fares-v2
          key: fares-v2-${{ github.ref_name }}-${{ steps.date.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fares-v2-${{ github.ref_name }}-${{ steps.date.outputs.day }}-

      - name: Raccogli tutte le origini e le date
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python scripts/fetch_prices.py

      - name: Conserva checkpoint anche in caso di errore
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/fares-v2
          key: fares-v2-${{ github.ref_name }}-${{ steps.date.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Rapporto della raccolta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: .cache/collection-report.json
          if-no-files-found: ignore
          retention-days: 30

      # Va PRIMA di build.py, che e' il passo che copia public/ dentro dist/.
      # L'anteprima social si ridisegna dall'indice appena raccolto: quella di
      # prima era dipinta a mano e mostrava una tariffa che non esisteva, con
      # numeri fermi a mesi addietro. Cosi' non puo' invecchiare. Se il browser
      # non parte si tiene l'immagine di ieri e l'indice esce lo stesso: un
      # guaio molto piu' piccolo di un indice fermo.
      # L'archivio permanente, su Cloudflare R2. E' l'unico passo che conserva
      # qualcosa per sempre: tutto il resto viene riscritto o scade.
      #
      # `continue-on-error` non e' pigrizia. Se R2 non risponde o le chiavi
      # scadono, il sito deve uscire lo stesso — e non si perde niente, perche'
      # `data/fares/` tiene sette giorni e lo script confronta la finestra con
      # l'archivio: il giorno mancante viene ripreso da solo la notte dopo.
      # Una settimana di margine su un guasto che va solo guardato, non corso.
      - name: Archivia le osservazioni su R2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip install --quiet pyarrow boto3
          python scripts/archivio.py

      - name: Ridisegna l'anteprima social
        continue-on-error: true
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          python scripts/genera_og.py

      - name: Ricompila il sito
        run: python scripts/build.py

      - name: Rigenera le pagine per aeroporto
        run: python scripts/build_pages.py

      # Il collaudo SEO legge le pagine dentro dist/, quindi va dopo che sono
      # state riscritte: eseguito prima misurerebbe la build di ieri.
      - name: Collaudo completo sulle pagine appena scritte
        run: python -m unittest discover -s tests -v

      - name: Verifica build, lingue e SEO
        run: python scripts/check_build.py

      - name: Committa se qualcosa e' cambiato
        run: |
          git config user.name  "efficiency-life-bot"
          git config user.email "actions@users.noreply.github.com"
          # functions/: build.py ci riscrive le costanti del modello, e se
          # non le committiamo la funzione live resta indietro rispetto alla
          # pagina — stessi voli, punteggi diversi.
          git add data/index.json data/history dist/ functions/ public/og.png
          git add data/catalog.json data/origins.json data/origin_schedule.json data/fares/ data/collection-report.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da pubblicare."
          else
            git commit -m "Indice tariffe $(date -u +%Y-%m-%d)"
            git push
            echo "Indice aggiornato e pubblicato."
          fi
